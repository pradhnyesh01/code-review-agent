[project]
name = "code-review-agent"
version = "0.1.0"
description = "Agent that reviews GitHub PRs against a repo's style guide and flags untested new logic."
readme = "README.md"
authors = [
    { name = "Pradhnyesh Khorgade", email = "pradhnyeshk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
code-review-agent = "code_review_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
